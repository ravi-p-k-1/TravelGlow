services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelglow}
      POSTGRES_USER: ${POSTGRES_USER:-travelglow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelglow_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://travelglow:travelglow_dev@postgres:5432/travelglow}
      YOUCAM_API_KEY: ${YOUCAM_API_KEY:-}
      YOUCAM_API_SECRET: ${YOUCAM_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      USE_MOCK_YOUCAM: ${USE_MOCK_YOUCAM:-true}
      USE_MOCK_WEATHER: ${USE_MOCK_WEATHER:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:

